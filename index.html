<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Holodeck Template</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #f6f7fb;
        color: #1f2937;
      }
      .card {
        background: #ffffff;
        border: 1px solid #d1d5db;
        border-radius: 12px;
        padding: 28px;
        width: min(560px, 92vw);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 16px;
        line-height: 1.5;
      }
      ul {
        margin: 0;
        padding-left: 20px;
      }
      a {
        color: #005fb2;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Demo Holodeck Template</h1>
      <p>Select a destination:</p>
      <ul>
        <li><a href="/demo/">Open Demo</a></li>
        <li><a href="/builder/">Open Builder</a></li>
      </ul>
    </main>
  </body>
</html>
