## PostgREST configuration for the self-hosted Data API.
##
## Every value here can be overridden by a PGRST_* environment variable
## (PostgREST reads env vars automatically), which is how Heroku supplies
## the real DATABASE_URL and JWT_SECRET at runtime. The literals below are
## safe local defaults for `postgrest postgrest.conf` during development.

## Connection string — overridden by PGRST_DB_URI ($DATABASE_URL on Heroku).
db-uri = "postgres://localhost/holodeck"

## Only the application schema is exposed over REST.
db-schemas = "public"

## Role PostgREST switches to for un-authenticated requests. Its grants
## decide what anon can see; here it should see nothing (RLS + no grants).
db-anon-role = "anon"

## HS256 shared secret — overridden by PGRST_JWT_SECRET ($JWT_SECRET).
## MUST match the secret the auth-shim signs with.
jwt-secret = "change-me-in-env"

## Bind to localhost only; server.js reverse-proxies /rest/v1 → here.
server-host = "127.0.0.1"
server-port = 3001

## Keep the pool small — Postgres, PostgREST, and the app share the
## Heroku Postgres connection ceiling. Tune via PGRST_DB_POOL if needed.
db-pool = 10
