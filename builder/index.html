<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Holodeck Builder — Authoring Workspace</title>
  <!-- Theme boot: set data-theme BEFORE the stylesheet loads so there is no
       light-to-dark flash. Uses the saved preference if the user picked one on
       the Profile page, else follows the OS. Mirrors the bxScale inline script
       below and the bx-recs-view localStorage convention in builder.js. -->
  <script>
  (function () {
    try {
      var saved = localStorage.getItem('bx-theme');           // "light" | "dark" | null
      var sys = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', saved || sys);
    } catch (e) {}
  })();
  </script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="builder.css" />
</head>
<body>

  <!-- Top bar — populated by builder.js -->
  <header class="bx-topbar">
    <div class="bx-topbar-left" id="bxTopbarLeft"></div>
    <div class="bx-topbar-actions" id="bxTopbarActions"></div>
  </header>

  <!-- Shell — builder.js fills with home / builder / aiPrompt -->
  <main class="bx-shell" id="bxShell"></main>

  <!-- Modal -->
  <div class="bx-modal" id="bxModal" hidden>
    <div class="bx-modal-card">
      <div class="bx-modal-head">
        <div class="bx-modal-title" id="bxModalTitle">Modal</div>
        <button class="bx-icon-btn" data-action="close-modal" aria-label="Close">×</button>
      </div>
      <div class="bx-modal-body" id="bxModalBody"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="bx-toast" id="bxToast" hidden></div>

  <!-- Scripts — order matters: shared modules first, app shell last -->
  <script src="recommendation-rules.js"></script>
  <script src="holodeck-shared.js"></script>
  <script src="preview-renderer.js"></script>
  <script src="config-generator.js"></script>
  <script src="ai-config-prompt.js"></script>
  <script src="claude-modify-prompt.js"></script>
  <!-- Backend endpoints (same-origin) — must load before auth.js/store -->
  <script src="/env-config.js"></script>
  <!-- Auth must load before the store so the store can read the JWT -->
  <script src="auth.js"></script>
  <script src="project-store.js"></script>
  <script src="feedback-store.js"></script>
  <script src="story-parser.js"></script>
  <script src="story-validator.js"></script>
  <script src="import-validator.js"></script>
  <script src="project-home.js"></script>
  <script src="share-modal.js"></script>
  <script src="holodeck-adapter.js"></script>
  <script src="zip-exporter.js"></script>
  <!-- Native file exporters (PPTX + PDF). Vendored UMD globals (classic
       scripts, self-contained: pptxgen.bundle.js inlines JSZip), then the
       shared normalization layer, then the two format exporters. -->
  <script src="vendor/pptxgen.bundle.js"></script>
  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="export-model.js"></script>
  <script src="pptx-exporter.js"></script>
  <script src="pdf-exporter.js"></script>
  <script src="aubrey-client.js"></script>
  <script src="gemini-client.js"></script>
  <!-- module: uses dynamic import()/import.meta to lazy-load vendored pdf.js -->
  <script type="module" src="doc-extract.js"></script>
  <!-- Scale the authoring UI with the viewport. Sets --bx-scale on <html>;
       builder.css reads it via calc(<px> * var(--bx-scale,1)). Mirrors the deck's ddScale;
       gentle clamp [0.9, 1.15] keeps an authoring tool legible and stable. -->
  <script>
  (function bxScale() {
    function setBuilderScale() {
      var scale = Math.min(window.innerWidth / 1440, window.innerHeight / 900);
      scale = Math.max(0.9, Math.min(scale, 1.15));
      document.documentElement.style.setProperty('--bx-scale', scale);
    }
    setBuilderScale();
    window.addEventListener('resize', setBuilderScale);
  })();
  </script>
  <script src="builder.js"></script>
</body>
</html>
